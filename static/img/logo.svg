<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ps-gradient-top" x1="20" y1="24" x2="96" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="ps-gradient-mid" x1="20" y1="40" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="ps-gradient-bottom" x1="20" y1="56" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#17365F"/>
    </linearGradient>

    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17365F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow-soft)">
    <!-- Camada inferior -->
    <g>
      <path d="M25 66.5L58.6 85.4C61.9 87.2 66.1 87.2 69.4 85.4L103 66.5C106.3 64.7 106.3 60.3 103 58.5L69.4 39.6C66.1 37.8 61.9 37.8 58.6 39.6L25 58.5C21.7 60.3 21.7 64.7 25 66.5Z" fill="url(#ps-gradient-bottom)">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 8; 0 5; 0 8"
          dur="3s"
          repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Camada do meio -->
    <g>
      <path d="M25 51.5L58.6 70.4C61.9 72.2 66.1 72.2 69.4 70.4L103 51.5C106.3 49.7 106.3 45.3 103 43.5L69.4 24.6C66.1 22.8 61.9 22.8 58.6 24.6L25 43.5C21.7 45.3 21.7 49.7 25 51.5Z" fill="url(#ps-gradient-mid)">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 2; 0 -2; 0 2"
          dur="3s"
          repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Camada superior -->
    <g>
      <path d="M25 36.5L58.6 55.4C61.9 57.2 66.1 57.2 69.4 55.4L103 36.5C106.3 34.7 106.3 30.3 103 28.5L69.4 9.6C66.1 7.8 61.9 7.8 58.6 9.6L25 28.5C21.7 30.3 21.7 34.7 25 36.5Z" fill="url(#ps-gradient-top)">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 -5; 0 -9; 0 -5"
          dur="3s"
          repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Ponto -->
    <g>
      <circle cx="82" cy="24" r="6" fill="white" opacity="0.95">
        <animate
          attributeName="r"
          values="6;7.5;6"
          dur="1.8s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.95;0.65;0.95"
          dur="1.8s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="82" cy="24" r="10" fill="white" opacity="0.0">
        <animate
          attributeName="r"
          values="8;16;8"
          dur="1.8s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.25;0;0.25"
          dur="1.8s"
          repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>