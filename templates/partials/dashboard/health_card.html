<div class="card">
    <div class="card-header">
        <h3><i class="fa-solid fa-heart-pulse"></i> Saúde & Fitness</h3>
    </div>

    <div class="card-body">
        <p><strong>Passos hoje:</strong> {{ health.passos_hoje }}</p>
        <p><strong>Peso atual:</strong> {{ health.peso_atual }}</p>

        <div
            class="progress-circle"
            style="background: conic-gradient(#37b26c 0 {{ health.progresso }}%, #dbe5ef {{ health.progresso }}% 100%);"
        >
            <div class="circle-inner">
                <strong>{{ health.treinos_feitos }}/{{ health.treinos_meta }}</strong>
                <span>Treinos</span>
            </div>
        </div>
    </div>
</div>
