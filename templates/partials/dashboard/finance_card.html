<div class="card">
    <div class="card-header">
        <h3><i class="fa-solid fa-wallet"></i> Financeiro</h3>
    </div>

    <div class="card-body">
        <p><strong>Saldo atual:</strong> R$ {{ finance.saldo_atual }}</p>
        <p><strong>Despesas do mês:</strong> R$ {{ finance.despesas_mes }}</p>

        <div class="fake-chart">
            {% for altura in finance.grafico %}
                <div class="bar" style="height: {{ altura }}%"></div>
            {% endfor %}
        </div>
    </div>
</div>
