<div class="card">
    <div class="card-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> Lista de Compras</h3>
    </div>

    <div class="card-body">
        <ul class="shopping-list">
            {% for item in shopping_items %}
                <li>
                    <input type="checkbox" {% if item.checked %}checked{% endif %}>
                    {{ item.nome }}
                </li>
            {% empty %}
                <li>Nenhum item na lista.</li>
            {% endfor %}
        </ul>

        <button class="btn">Adicionar item</button>
    </div>
</div>
