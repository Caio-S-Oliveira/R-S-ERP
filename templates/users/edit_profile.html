{% extends "base.html" %}

{% block title %}Editar Perfil | PersonalSpace{% endblock %}

{% block content %}
<section class="profile-page">
    <div class="profile-card">
        <div class="profile-card__header-simple">
            <h1>Editar perfil</h1>
            <p>Atualize seus dados sem sofrer.</p>
        </div>

        <form method="post" class="profile-form">
            {% csrf_token %}

            <div class="form-grid">
                <div class="form-group">
                    <label for="{{ form.first_name.id_for_label }}">Nome</label>
                    {{ form.first_name }}
                </div>

                <div class="form-group">
                    <label for="{{ form.last_name.id_for_label }}">Sobrenome</label>
                    {{ form.last_name }}
                </div>

                <div class="form-group">
                    <label for="{{ form.email.id_for_label }}">E-mail</label>
                    {{ form.email }}
                </div>

                <div class="form-group">
                    <label for="{{ form.avatar.id_for_label }}">URL do avatar</label>
                    {{ form.avatar }}
                </div>

                <div class="form-group form-group--full">
                    <label for="{{ form.bio.id_for_label }}">Bio</label>
                    {{ form.bio }}
                </div>
            </div>

            <div class="profile-actions">
                <button type="submit" class="btn">Salvar alterações</button>
                <a href="{% url 'user_profile' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
