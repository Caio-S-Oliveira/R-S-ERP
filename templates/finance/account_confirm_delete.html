{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h1 class="h4 mb-3">Excluir conta</h1>
            <p>Tem certeza que deseja excluir <strong>{{ object.name }}</strong>?</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Excluir</button>
                    <a href="{% url 'account_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
